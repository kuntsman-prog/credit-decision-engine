# Параметры кредитной политики: пороги решений и расчёт лимита.
annual_rate: 0.20          # ставка для расчёта платежа
min_dscr_for_limit: 1.25   # лимит подбирается так, чтобы DSCR был не ниже этого значения
max_ltv_for_limit: 0.80    # и кредит не превышал 80% залога

# Рейтинговые классы по вероятности дефолта (PD) на 12 месяцев
grades:
  - {grade: A, max_pd: 0.01}
  - {grade: B, max_pd: 0.025}
  - {grade: C, max_pd: 0.05}
  - {grade: D, max_pd: 0.10}
  - {grade: E, max_pd: 1.0}

# Решение по классу, если не сработали правила
outcome_by_grade:
  A: APPROVE
  B: APPROVE
  C: APPROVE
  D: REFER
  E: DECLINE
